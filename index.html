<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#f3f6fb;--sf:#fff;--s2:#eef2f9;--tx:#1f2430;--mu:#667085;--bd:#dde3ee;--ac:#2563eb;--ok:#16794a;--okb:#e3f5ea;--wa:#a15c00;--wab:#fff3d6;--er:#c0362c;--erb:#fde7e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--sf:#182030;--s2:#202a3d;--tx:#e8ecf4;--mu:#9aa6bd;--bd:#2c3850;--ac:#6ea0ff;--ok:#5fd394;--okb:#143525;--wa:#f0b955;--wab:#3a2c10;--er:#ff8a80;--erb:#3d1a18}}
:root[data-theme="dark"]{--bg:#10151f;--sf:#182030;--s2:#202a3d;--tx:#e8ecf4;--mu:#9aa6bd;--bd:#2c3850;--ac:#6ea0ff;--ok:#5fd394;--okb:#143525;--wa:#f0b955;--wab:#3a2c10;--er:#ff8a80;--erb:#3d1a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Sarabun,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ac);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ac);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
header b{flex:1;font-size:1.05rem}header button{background:#ffffff26;color:#fff;border:0;border-radius:18px;padding:4px 11px;font:inherit;font-size:.82rem;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px;display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
h3{margin:0 0 10px;font-size:1rem}.mu{color:var(--mu);font-size:.85rem}
input,textarea,select{width:100%;font:inherit;background:var(--s2);color:var(--tx);border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;margin:4px 0}
textarea{min-height:80px;resize:vertical}
.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.o{background:none;color:var(--ac);border:1.5px solid var(--ac)}.btn.s{padding:4px 10px;font-size:.85rem}
.ci{display:block;width:100%;text-align:left;background:var(--s2);border:1.5px solid transparent;border-radius:10px;padding:9px 11px;margin-bottom:6px;font:inherit;color:var(--tx);cursor:pointer}
.ci.on{border-color:var(--ac)}.ci small{display:block;color:var(--mu)}
.chip{display:inline-block;font-size:.75rem;font-weight:700;border-radius:12px;padding:2px 9px}
.c-no{background:var(--erb);color:var(--er)}.c-wait{background:var(--wab);color:var(--wa)}.c-ok{background:var(--okb);color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ai{border:1px solid var(--bd);border-radius:10px;padding:11px;margin-bottom:8px;background:var(--sf)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}td input{margin:0;min-width:70px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.st div{background:var(--s2);border-radius:8px;padding:8px;text-align:center}.st b{display:block;font-size:1.3rem}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:20}#toast.on{opacity:1}
.login{max-width:380px;margin:40px auto}.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}
a{color:var(--ac)}
</style></head><body>
<header><b>🏫 ห้องเรียนออนไลน์</b><span id="who" class="mu" style="color:#fff"></span><button data-a="theme">🌓</button><button data-a="api">⚙️</button><button data-a="cp" id="cpb" hidden>🔑 รหัสผ่าน</button><button data-a="out" id="outb" hidden>ออก</button></header>
<main id="app"></main><div id="toast"></div>
<script>
const K='classroom_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
const mkCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ',P=A+'23456789';let s=A[Math.random()*A.length|0];for(let i=0;i<4;i++)s+=P[Math.random()*P.length|0];return s};
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzUGK054I6L9m-H4n-yagzx5c3qu3CAUGabeYJ-onocqsodVGVzC0MFQuL8W1A5UrHFIg/exec';// วาง URL ของ Apps Script ที่นี่ก่อนนำขึ้นโฮสต์ นักเรียนจะไม่ต้องตั้งค่าเอง
let S,me=null,v={c:null,a:null,t:'work'},API='',role='t',TOK='',lm='in';
try{API=localStorage.getItem('cr_api')||DEFAULT_API;me=JSON.parse(localStorage.getItem('cr_me')||sessionStorage.getItem('cr_me')||'null');TOK=localStorage.getItem('cr_tok')||sessionStorage.getItem('cr_tok')||'';const th=localStorage.getItem('cr_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(API&&!TOK)me=null;
function seed(){const n=['กฤษณะ เป้าเงิน','กิติภูมิ ถาชินเลิศ','ณัฐกิตติ์ อินเขียว','ธนภัทร พรมวงศ์'];
 return{classes:[{id:'c1',name:'คณิตศาสตร์ ม.3',code:'MATH3A',teacher:'ครูพิชญา'},{id:'c2',name:'วิทยาศาสตร์ ม.3',code:'SCI3B',teacher:'ครูพิชญา'}],
 members:n.map((x,i)=>({id:'m'+i,cls:'c1',name:x})).concat(n.slice(0,2).map((x,i)=>({id:'k'+i,cls:'c2',name:x}))),
 asgs:[{id:'a1',cls:'c1',title:'แบบฝึกหัด สมการเชิงเส้น',desc:'ทำข้อ 1-10 หน้า 45 แล้วพิมพ์คำตอบหรือแนบลิงก์รูปงาน',due:'2026-11-10',max:10},{id:'a2',cls:'c1',title:'โจทย์ปัญหา ร้อยละ',desc:'แสดงวิธีทำ 5 ข้อ',due:'2026-11-20',max:20},{id:'a3',cls:'c2',title:'รายงานการทดลอง',desc:'สรุปผลการทดลองสั้นๆ',due:'2026-11-15',max:20}],
 subs:[{id:'s1',asg:'a1',name:n[0],text:'ข้อ 1 x=3 ข้อ 2 x=5 …',at:'2026-11-02T09:10',score:9,fb:'ดีมาก ข้อ 7 ตรวจสอบอีกครั้ง'},{id:'s2',asg:'a1',name:n[1],text:'https://example.com/my-work.jpg',at:'2026-11-03T08:00',score:null,fb:''}]}}
function load(){if(API){S={classes:[],members:[],asgs:[],subs:[]};return}try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.classes)S=seed()}
function save(){if(API)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('เก็บในเครื่องไม่ได้ (พื้นที่เต็มหรือถูกบล็อก)')}}
function put(t,row,del){const L=S[t],i=L.findIndex(x=>x.id===row.id);if(del){if(i>=0)L.splice(i,1)}else if(i>=0)L[i]=row;else L.push(row);save();
 if(API)fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOK,table:t,row,op:del?'del':'up'})}).then(r=>r.text()).then(t=>{try{return JSON.parse(t)}catch(e){throw new Error('NOJSON')}}).then(r=>{if(!r.ok&&r.error==='auth'){logout();showErr('เซิร์ฟเวอร์ไม่รับโทเคนล็อกอิน (เหตุผล: '+esc(r.why||'ไม่ระบุ — Code.gs ยังเป็นเวอร์ชันเก่า')+') กรุณาล็อกอินใหม่');return}if(!r.ok){showErr('เซิร์ฟเวอร์ปฏิเสธการบันทึก: '+esc(r.error||'ไม่ทราบสาเหตุ'));toast(r.error=='auth'?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':(r.error||'บันทึกไม่สำเร็จ'));pull().then(render)}}).catch(diag)}
async function pull(){if(!API||!TOK)return;try{const r=await(await fetch(API+'?token='+encodeURIComponent(TOK))).json();if(r.error==='auth'){logout();showErr('เซิร์ฟเวอร์ไม่รับโทเคนล็อกอิน (เหตุผล: '+esc(r.why||'ไม่ระบุ — Code.gs ยังเป็นเวอร์ชันเก่า')+') กรุณาล็อกอินใหม่');return}S=r}catch(e){diag(e)}}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
const has=s=>s&&s.score!==null&&s.score!==''&&s.score!==undefined;
const sub=(a,n)=>S.subs.find(s=>s.asg===a&&s.name===n);
const stat=s=>!s?['ยังไม่ส่ง','c-no']:has(s)?['ตรวจแล้ว','c-ok']:['รอตรวจ','c-wait'];
const chip=s=>{const[t,c]=stat(s);return`<span class="chip ${c}">${t}</span>`};
const fd=d=>d?new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';
const link=t=>esc(t).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const nmz=s=>String(s==null?'':s).normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();
const myC=()=>me.role==='t'?S.classes.filter(c=>nmz(c.teacher)===nmz(me.name)):S.classes.filter(c=>S.members.some(m=>m.cls===c.id&&m.name===me.name));
const att=s=>s&&s.furl?`<div><a href="${esc(s.furl)}" download="${esc(s.fname)}" target="_blank" rel="noopener">📎 ${esc(s.fname||'ไฟล์แนบ')}</a></div>`:'';
const apiP=()=>v.api?`<div class="card" style="grid-column:1/-1"><h3>เชื่อม Google Sheets</h3><input id="apiu" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(API)}"><button class="btn s" data-a="saveapi">บันทึก</button> <span class="mu">เว้นว่าง = ใช้ข้อมูลในเครื่อง</span></div>`:'';
function sumData(c){const as=S.asgs.filter(a=>a.cls==c.id),ms=S.members.filter(m=>m.cls==c.id),tm=as.reduce((p,a)=>p+ +a.max,0);
 const rows=ms.map(m=>{const sc=as.map(a=>{const s=sub(a.id,m.name);return has(s)?+s.score:null});const tot=sc.reduce((p,x)=>p+(x||0),0);return{n:m.name,sc,tot,pct:tm?tot/tm*100:0}});
 const avg=as.map((a,i)=>{const g=rows.filter(r=>r.sc[i]!==null);return g.length?g.reduce((p,r)=>p+r.sc[i],0)/g.length:null});
 return{as,rows,tm,avg}}
function sumView(c){const d=sumData(c);if(!d.as.length)return'<p class="mu">ยังไม่มีงานให้สรุป</p>';const f=x=>x===null?'-':+x.toFixed(1);
 const ta=d.rows.length?d.rows.reduce((p,r)=>p+r.tot,0)/d.rows.length:null;
 return`<div class="row"><h3>สรุปคะแนนรวม (เต็ม ${d.tm})</h3><button class="btn s o" data-a="csv">⬇ CSV</button></div><div class="tw"><table><tr><th>ชื่อ</th>${d.as.map(a=>`<th>${esc(a.title)}<br><span class="mu">/${a.max}</span></th>`).join('')}<th>รวม</th><th>%</th></tr>${d.rows.map(r=>`<tr><td>${esc(r.n)}</td>${r.sc.map(x=>`<td>${f(x)}</td>`).join('')}<td><b>${r.tot}</b></td><td>${r.pct.toFixed(0)}%</td></tr>`).join('')}<tr><td><b>เฉลี่ยห้อง</b></td>${d.avg.map(x=>`<td><b>${f(x)}</b></td>`).join('')}<td><b>${f(ta)}</b></td><td></td></tr></table></div><p class="mu">“-” คือยังไม่ส่งหรือยังไม่ตรวจ (นับเป็น 0 ในคะแนนรวม)</p>`}
function csv(c){const d=sumData(c);const L=[['ชื่อ',...d.as.map(a=>a.title+' /'+a.max),'รวม /'+d.tm,'%']].concat(d.rows.map(r=>[r.n,...r.sc.map(x=>x===null?'':x),r.tot,r.pct.toFixed(0)]));
 const t='\ufeff'+L.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='สรุปคะแนน_'+c.name+'.csv';a.click()}
const pend={};
const LIM=()=>API?15e6:7e5;
function pv(id){const el=$('#pv-'+id);if(!el)return;const L=pend[id]||[];el.innerHTML=L.length?(L.every(f=>/^image\//.test(f.type))?'เลือกรูปแล้ว '+L.length+' หน้า → จะรวมเป็น PDF 1 ไฟล์':'ไฟล์ที่เลือก')+'<br>'+L.map((f,i)=>(i+1)+'. '+esc(f.name)+' <a href="#" data-a="rmimg" data-id="'+id+'" data-i="'+i+'">✕ ลบ</a>').join('<br>'):''}
document.addEventListener('change',e=>{const t=e.target;if(!t.id||t.id.slice(0,3)!='fl-')return;const id=t.id.slice(3);pend[id]=(pend[id]||[]).concat([...t.files]);t.value='';pv(id)});
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};i.src=u});
async function imgsToPdf(L){const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',compress:true}),W=210,H=297,M=5;
 for(let k=0;k<L.length;k++){const im=await loadImg(L[k]),w0=im.naturalWidth,h0=im.naturalHeight,sc=Math.min(1,1800/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const r=Math.min((W-2*M)/c.width,(H-2*M)/c.height),w=c.width*r,hh=c.height*r;if(k)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.75),'JPEG',(W-w)/2,(H-hh)/2,w,hh)}
 return pdf.output('blob')}
async function doSubmit(id){const t=(($('#tx-'+id)||{}).value||'').trim(),L=pend[id]||[],o=sub(id,me.name);
 if(!t&&!L.length&&!(o&&o.furl))return toast('ใส่ข้อความหรือแนบไฟล์ก่อน');
 let fname=o?o.fname||'':'',furl=o?o.furl||'':'';
 if(L.length){let f;
  try{if(L.every(x=>/^image\//.test(x.type))){if(!window.jspdf)return toast('โหลดตัวสร้าง PDF ไม่ได้ (ต้องมีอินเทอร์เน็ต)');toast('กำลังแปลงรูปเป็น PDF…');f=new File([await imgsToPdf(L)],'งาน-'+me.name.replace(/[\\/:*?"<>|]/g,'')+'.pdf',{type:'application/pdf'})}
   else if(L.length==1)f=L[0];else return toast('เลือกรูปภาพได้หลายรูป หรือไฟล์เอกสารได้ครั้งละ 1 ไฟล์')}
  catch(e){return toast('แปลงรูปเป็น PDF ไม่สำเร็จ ลองใหม่หรือลดจำนวนรูป')}
  if(f.size>LIM())return toast('ไฟล์ใหญ่เกิน '+(API?'15 MB':'700 KB (โหมดทดลอง)')+' (ขนาด '+(f.size/1e6).toFixed(1)+' MB)');toast('กำลังอัปโหลด…');
  try{const u=await new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});furl=u;fname=f.name;
   if(API){const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOK,op:'upload',name:f.name,type:f.type,data:u.split(',')[1]})})).json();if(!r.ok)throw 0;furl=r.url}}
  catch(e){return toast('อัปโหลดไม่สำเร็จ')}
  delete pend[id]}
 put('subs',{id:o?o.id:uid(),asg:id,name:me.name,text:t,at:new Date().toISOString(),score:null,fb:'',fname,furl});toast('ส่งงานแล้ว');render()}

async function post(b){return(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOK,...b})})).json()}
function dl(L,name){const t='\ufeff'+L.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
function pplView(c,ms){const r=v.res;
 return`<h3>นักเรียน ${ms.length} คน</h3><div class="ai"><b>เพิ่มรายชื่อนักเรียน</b><div class="mu">บรรทัดละ 1 คน รูปแบบ <b>รหัสนักเรียน, ชื่อ-นามสกุล</b> (วางจาก Excel ได้)${API?' · ใส่รหัสผ่านเองต่อท้ายด้วย , ได้ ถ้าไม่ใส่ระบบสุ่มเลข 6 หลักให้':''}</div><textarea id="rl" placeholder="10001, เด็กชายกฤษณะ เป้าเงิน&#10;10002, เด็กชายกิติภูมิ ถาชินเลิศ&#10;10003, เด็กหญิงสมใจ ใจดี, 5678"></textarea><button class="btn s" data-a="addstu">+ เพิ่มนักเรียน</button></div><div class="ai"><b>นำเข้าจาก Excel (.xlsx)</b><div class="mu">คอลัมน์: รหัสนักเรียน · ชื่อ-นามสกุล · รหัสผ่าน (ไม่บังคับ) ถ้านักเรียนเรียนหลายวิชา ใช้รหัสนักเรียนเดียวกันได้ ระบบจะใช้บัญชีเดิม ไม่สร้างซ้ำ</div><input type="file" id="xl" accept=".xlsx,.xls,.csv"><button class="btn s" data-a="impx">นำเข้า</button> <button class="btn s o" data-a="tpl">ไฟล์ตัวอย่าง</button></div>${r?`<div class="ai"><b>รหัสผ่านสำหรับแจกนักเรียน</b><div class="mu">แสดงครั้งนี้ครั้งเดียว กรุณาบันทึกหรือดาวน์โหลดไว้</div><div class="tw"><table>${r.map(x=>`<tr><td>${esc(x.sid||'')}</td><td>${esc(x.name)}</td><td><b>${esc(x.pw)}</b></td></tr>`).join('')}</table></div><button class="btn s o" data-a="rescsv">⬇ CSV</button></div>`:''}${ms.map((m,i)=>`<div class="ai row"><span>${i+1}. ${m.sid?'<b>'+esc(m.sid)+'</b> · ':''}${esc(m.name)}</span><span>${API?`<button class="btn s o" data-a="rst" data-n="${esc(m.name)}">รีเซ็ตรหัส</button> `:''}<button class="btn s o" data-a="unen" data-n="${esc(m.name)}">ลบ</button></span></div>`).join('')}`}
function impX(){const f=(($('#xl')||{}).files||[])[0];if(!f)return toast('เลือกไฟล์ก่อน');if(!window.XLSX)return toast('โหลดตัวอ่าน Excel ไม่ได้ (ต้องมีอินเทอร์เน็ต)');
 const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});if(!R.length)return toast('ไฟล์ว่าง');
  const hd=R[0].map(x=>String(x).toLowerCase()),fi=(...k)=>hd.findIndex(h=>k.some(w=>h.includes(w)));
  let ip=fi('รหัสผ่าน','password','pass'),ii=fi('รหัสนักเรียน','เลขประจำตัว','student','id'),iN=fi('ชื่อ','name'),iL=fi('นามสกุล','surname','last'),iP=fi('คำนำหน้า','prefix','title'),st=1;
  if(ii===ip)ii=-1;
  if(iN<0&&ii<0){st=0;const w=R[0].length;ii=w>1?0:-1;iN=w>1?1:0;ip=w>2?2:-1;iL=-1;iP=-1}
  const g=(r,i)=>i>=0?String(r[i]).trim():'';
  const L=R.slice(st).map(r=>({sid:g(r,ii),name:(g(r,iP)+g(r,iN)+(iL>=0&&iL!==iN?' '+g(r,iL):'')).trim(),pw:g(r,ip)})).filter(x=>x.name||x.sid);
  addList(L)}catch(x){toast('อ่านไฟล์ไม่สำเร็จ')}};rd.readAsArrayBuffer(f)}

async function addStu(txt){const L=txt.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split(/\t|,/).map(x=>x.trim());

function logout(){me=null;TOK='';try{['cr_me','cr_tok'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)})}catch(x){}v={c:null,a:null,t:'work'};render()}
async function joinApi(code){try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOK,op:'join',code:code.trim()})})).json();if(!r.ok)return toast(r.error=='auth'?'เซสชันหมดอายุ':r.error);await pull();v={c:r.cls,a:null,t:'work'};toast('เข้าร่วมห้องแล้ว');render()}catch(e){toast('เชื่อมต่อไม่ได้')}}
async function doAuth(){const reg=lm=='up',g=i=>($('#'+i)||{}).value||'',n=g('un').trim(),pw=g('pw'),rem=$('#rm').checked;if(!n||!pw)return;toast('กำลังตรวจสอบ…');
 try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({op:reg?'register':'login',name:n,password:pw,role:role=='t'?'teacher':'student',code:g('tc')})})).json();
  if(!r.ok)return toast(r.error||'ไม่สำเร็จ');TOK=r.token;me={role:r.user.role=='teacher'?'t':'s',name:r.user.name};
  const st=rem?localStorage:sessionStorage;try{st.setItem('cr_tok',TOK);st.setItem('cr_me',JSON.stringify(me))}catch(x){}
  try{if(window.PasswordCredential)await navigator.credentials.store(new PasswordCredential({id:n,password:pw,name:n}))}catch(x){}
  v={c:null,a:null,t:'work'};await pull();render()}catch(e){diag(e)}}
document.addEventListener('submit',e=>{if(e.target.id=='lf'){e.preventDefault();doAuth()}});
